<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Borrar Evento</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
<script src="js/abm.js" type="text/javascript"></script>
</head>

<body onload="OnLoad();">

<div id='event_delete_back_btn' class='back-btn' onclick="window.location.replace('event_list.html');" >
	<img id='event_delete_back_icon' class='icon-btn' src='images/no.png'>&nbsp;Cancelar
</div>

<div id='event_delete_save_btn' class='submit-btn' onclick="SaveData();" >
	<img id='event_delete_save_icon' class='icon-btn' src='images/ok.png'>&nbsp;Borrar
</div>

<div id='event_delete_div' class='abm-div'></div>

<script type="text/javascript" >
    // 0=Output, 1=Input, 2=Analog, 3=Output Alarma, 4=Input Alarma, 5=Output Pulse/Analog_Mult_Div_Valor=Pulse Param, 6=Periferico
    var ass_list_input = [];
    var ass_list_output = [];

    function LoadAssignList(data) {
        if(data.error != 0) return;
        list = data.response;
        for (var i = 0; i < list.length; i++) {
            var ass = {};
            ass.value = list[i].Id;
            ass.label = list[i].Objeto;
            if(list[i].Id == 0) {
                ass_list_output.push(ass);
                ass_list_input.push(ass);
            } else if(list[i].Tipo == 0 || list[i].Tipo == 3 || list[i].Tipo == 5) {
                ass_list_output.push(ass);
            } else if(list[i].Tipo == 1 || list[i].Tipo == 4 || list[i].Tipo == 6) {
                ass_list_input.push(ass);
            }
        }
    }

    function ArmarTabla(data, dst_div, title) {
        var dst = document.getElementById(dst_div);
        if (!dst) return;

        if (!data || typeof data !== 'object') {
            dst.innerHTML = '<p>Error: datos inválidos.</p>';
            return;
        }

        if (data.error !== 0) {
            dst.innerHTML = '<p>' + (data.message ? data.message : 'Error desconocido') + '</p>';
            return;
        }

        var response = data.response;
        if (!response || typeof response !== 'object') {
            dst.innerHTML = '<p>Error: respuesta inválida.</p>';
            return;
        }

        var obj = Array.isArray(response) ? (response.length ? response[0] : {}) : response;

        var headers = [];
        for (var k in obj) {
            if (headers.indexOf(k) === -1) headers.push(k);
        }

        var output = '<p class=abm-table-title>' + title + '</p>\n';
        output += '<table class=abm-table id=abm_edit_table>\n';

        for (var i = 0; i < headers.length; i++) {
            var h = headers[i];
            var val = obj[h];
            if (val === null || val === undefined || val === 'NULL') val = '';

            output += '<tr>';
            output += '<th>' + (h === 'Id' ? '&nbsp;' : h) + '</th>';
            output += '<td>';
            if (h === 'Id') {
                output += '<input type="hidden" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + String(val).replace(/"/g, '&quot;') + '" />';
            } else if (h === 'Objeto_Origen') {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + GetLabelFromValue(ass_list_input, val) + '" readonly />';
            } else if (h === 'Objeto_Destino') {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + GetLabelFromValue(ass_list_output, val) + '" readonly />';
            } else if (h === 'ON_a_OFF') {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + ListaSiNo[val] + '" readonly />';
            } else if (h === 'OFF_a_ON') {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + ListaSiNo[val] + '" readonly />';
            } else if (h === 'Enviar') {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + TablaAcciones[val] + '" readonly />';
            } else {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + String(val).replace(/"/g, '&quot;') + '" readonly />';
            }
            output += '</td>';
            output += '</tr>\n';
        }

        output += '</table>\n';
        dst.innerHTML = output;
    }

    function OnLoad() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('Id'); // recupera el valor de ?Id=123

        fetch("/cgi-bin/abmassign.cgi?funcion=listall") // Consulta para armar listado de objetos disponibles
        .then(response => response.json())
        .then(data => LoadAssignList(data))
        .catch(error => {
            console.error("Error al cargar lista de asignaciones: " + error);
        });

        fetch("/cgi-bin/abmev.cgi?funcion=get&Id=" + id) // Consulta
        .then(response => response.json())
        .then(data => ArmarTabla(data, 'event_delete_div', 'Borrar Objeto'))
        .catch(error => {
            document.getElementById("event_delete_div").innerHTML =
                "<p>Error al obtener datos: " + error + "</p>";
        });
    }
    
    function SaveData() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('Id'); // recupera el valor de ?Id=123
        fetch("/cgi-bin/abmev.cgi?funcion=delete&Id=" + id) // Consulta
        .catch(function(){} )
        .finally(function(){ window.location.replace('event_list.html'); });
    }
</script>

</form>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
