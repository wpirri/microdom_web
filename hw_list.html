<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Dispositivos</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
<script src="js/abm.js" type="text/javascript"></script>
</head>

<body onload='OnLoad();'>

<div id='hw_list_back_btn' class='back-btn' onclick="window.location.replace('config_menu.html');" >
	<img id='hw_list_back_icon' class='icon-btn' src='images/back.png'>&nbsp;Volver
</div>

<div id='hw_list_add_btn' class='add-btn' onclick="window.location.replace('hw_add.html');" >
	<img id='hw_list_add__icon' class='icon-btn' src='images/add.png'>&nbsp;Nuevo
</div>

<div id='hw_list_table_div' class='abm-div'></div>

<script type="text/javascript" >
    function ArmarLista(data, divId, title, idField, editPage, deletePage) {
        if(data.error != 0) {
            document.getElementById(divId).innerHTML =
                '<p>Error al obtener el listado de HW: ' + data.message + '</p>';
            return;
        }

        let html = '<div class=abm-table-title>&nbsp;' + title + '</div>\n';
        const rows = Array.isArray(data.response) ? data.response : [];
        if (rows.length === 0) {
            html += '<p>No hay datos disponibles.</p>';
            document.getElementById(divId).innerHTML = html;
            return;
        }

        const fieldSet = new Set();
        const fields = [];
        rows.forEach(item => {
            Object.keys(item).forEach(field => {
                if (field !== idField && !fieldSet.has(field)) {
                    fieldSet.add(field);
                    fields.push(field);
                }
            });
        });

        //html += "<table class='abm-table'><tr><th>ID</th>";
        html += "<table class='abm-list-table abm-sticky-header-table'><tr>";
        fields.forEach(field => {
            html += "<th>" + field + "</th>";
        });
        html += "<th>Modificar</th><th>Eliminar</th><th>FW</th><th>WiFi</th><th>I/O</th></tr>";

        rows.forEach(item => {
            if(item[idField] != 0) {
                html += "<tr>";
                //html += "<td>" + (item[idField] ?? "") + "</td>";
                fields.forEach(field => {
                    if(field == "Tipo") {
                        html += "<td>" + TipoHW[item[field]] + "</td>";
                    } else if(field == "Estado") {
                        html += "<td>" + EstadoHW[item[field]] + "</td>";
                    } else {
                        html += "<td>" + (item[field] ?? "") + "</td>";
                    }
                });
                html += "<td><img src='images/edit.png' class='touch-icon-btn' title='Editar' onclick=\"window.location.replace('" + editPage + "?Id=" + item[idField] + "');\"></td>";
                html += "<td><img src='images/delete.png' class='touch-icon-btn' title='Eliminar' onclick=\"window.location.replace('" + deletePage + "?Id=" + item[idField] + "');\"></td>";
                if(item["Estado"] == 0) {
                    html += "<td>&nbsp;</td>";
                    html += "<td>&nbsp;</td>";
                    html += "<td>&nbsp;</td>";

                } else {
                    html += "<td><div id='firmware-update-" + item[idField] + "'><img src='images/update3.png' class='touch-icon-btn' title='Actualizar' onclick=\"UpdateFirmware(" + item[idField] + ")\"></div></td>";
                    html += "<td><div id='wifi-update-" + item[idField] + "'><img src='images/update3.png' class='touch-icon-btn' title='Actualizar' onclick=\"UpdateWiFi(" + item[idField] + ")\"></div></td>";
                    html += "<td><div id='ioconfig-update-" + item[idField] + "'><img src='images/update3.png' class='touch-icon-btn' title='Actualizar' onclick=\"UpdateIOConfig(" + item[idField] + ")\"></div></td>";
                }
                html += "</tr>";
            }
        });

        html += "</table>";
        document.getElementById(divId).innerHTML = html;
    }

    function OnLoad() {
        fetch("/abm/abmhw") // Consulta
        .then(response => response.json())
        .then(data => ArmarLista(data, 'hw_list_table_div', 'Dispositivos', 'Id', 'hw_edit.html', 'hw_delete.html'))
        .catch(error => {
            document.getElementById("hw_list_table_div").innerHTML =
                '<p>Error al obtener el listado de HW: ' + error + '</p>';
        });
    }

    function UpdateFirmware(id) {
        fetch('/abm/abmhw?funcion=update_firmware&Id=' + id)
        .then(response => response.json())
        .then(data => { document.getElementById("firmware-update-" + id).innerHTML = "<img src='images/ok.png' class='touch-icon-btn'>"; } )
        .catch(error => { document.getElementById("firmware-update-" + id).innerHTML = "<img src='images/no.png' class='touch-icon-btn'>"; } );

    }

    function UpdateWiFi(id) {
        fetch('/abm/abmhw?funcion=update_wifi&Id=' + id)
        .then(response => response.json())
        .then(data => { document.getElementById("wifi-update-" + id).innerHTML = "<img src='images/ok.png' class='touch-icon-btn'>"; } )
        .catch(error => { document.getElementById("wifi-update-" + id).innerHTML = "<img src='images/no.png' class='touch-icon-btn'>"; } );

    }

    function UpdateIOConfig(id) {
        fetch('/abm/abmhw?funcion=update_ioconfig&Id=' + id)
        .then(response => response.json())
        .then(data => { document.getElementById("ioconfig-update-" + id).innerHTML = "<img src='images/ok.png' class='touch-icon-btn'>"; } )
        .catch(error => { document.getElementById("ioconfig-update-" + id).innerHTML = "<img src='images/no.png' class='touch-icon-btn'>"; } );
    }

</script>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
