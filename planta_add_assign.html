<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Objetos</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
</head>

<body onload='OnLoad();'>

<div id='ass_list_back_btn' class='back-btn' onclick="window.location.replace('planta_edit.html');" >
	<img id='ass_list_back_icon' class='icon-btn' src='images/back.png'>&nbsp;Volver
</div>

<div id='ass_list_table_div' class='abm-div'></div>

<script type="text/javascript" >
	PLANTA=1;

    function ArmarLista(data, divId, title, idField, addFcn) {
        if(data.error != 0) {
            document.getElementById(divId).innerHTML =
                '<p>Error al obtener el listado de Objetos: ' + data.message + '</p>';
            return;
        }

        let html = '<div class=abm-table-title>&nbsp;' + title + '</div>\n';
        const rows = Array.isArray(data.response) ? data.response : [];
        if (rows.length === 0) {
            html += '<p>No hay datos disponibles.</p>';
            document.getElementById(divId).innerHTML = html;
            return;
        }

        const fieldSet = new Set();
        const fields = [];
        rows.forEach(item => {
            Object.keys(item).forEach(field => {
                if (field !== idField && !fieldSet.has(field)) {
                    fieldSet.add(field);
                    fields.push(field);
                }
            });
        });

        //html += "<table class='abm-table'><tr><th>ID</th>";
        html += "<table class='abm-list-table'><tr>";
        fields.forEach(field => {
            html += "<th>" + field + "</th>";
        });
        html += "<th>Agregar</th></tr>";

        rows.forEach(item => {
            if(item[idField] != 0 && (item.Tipo == 0 || item.Tipo == 3 || item.Tipo == 5)) {
                html += "<tr>";
                //html += "<td>" + (item[idField] ?? "") + "</td>";
                fields.forEach(field => {
                    html += "<td>" + (item[field] ?? "") + "</td>";
                });
                html += "<td><img src='images/edit.png' class='abm-list-icon' title='Agregar' onclick=\"" + addFcn + "(" + item[idField] + ");\"></td>";
                html += "</tr>";
            }
        });

        html += "</table>";
        document.getElementById(divId).innerHTML = html;
    }

    function AddAssignToPlanta(id) {
        fetch('/cgi-bin/abmassign.cgi?funcion=addassigntoplanta&Id=' + id + '&Planta=' + PLANTA) // Consulta
        .catch(function(){} )
        .finally(function(){ window.location.replace('planta_edit.html'); });
    }

    function OnLoad() {
        fetch("/cgi-bin/abmassign.cgi") // Consulta
        .then(response => response.json())
        .then(data => ArmarLista(data, 'ass_list_table_div', 'Agregar Objeto', 'Id', 'AddAssignToPlanta'))
        .catch(error => {
            document.getElementById("ass_list_table_div").innerHTML =
                '<p>Error al obtener el listado de Objetos: ' + error + '</p>';
        });
    }

</script>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
