<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Dispositivos</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
</head>

<body onload='OnLoad();'>

<div id='event_list_back_btn' class='back-btn' onclick="window.location.replace('config_menu.html');" >
	<img id='event_list_back_icon' class='icon-btn' src='images/back.png'>&nbsp;Volver
</div>

<div id='event_list_add_btn' class='add-btn' onclick="window.location.replace('event_add.html');" >
	<img id='event_list_add__icon' class='icon-btn' src='images/add.png'>&nbsp;Nuevo
</div>

<div id='event_list_table_div' class='abm-div'></div>

<script type="text/javascript" >
    function ArmarLista(data, divId, title, idField, editPage, deletePage) {
        if(data.error != 0) {
            document.getElementById(divId).innerHTML =
                '<p>Error al obtener el listado de Eventos: ' + data.message + '</p>';
            return;
        }

        let html = '<div class=abm-table-title>&nbsp;' + title + '</div>\n';
        const rows = Array.isArray(data.response) ? data.response : [];
        if (rows.length === 0) {
            html += '<p>No hay datos disponibles.</p>';
            document.getElementById(divId).innerHTML = html;
            return;
        }

        const fieldSet = new Set();
        const fields = [];
        rows.forEach(item => {
            Object.keys(item).forEach(field => {
                if (field !== idField && !fieldSet.has(field)) {
                    fieldSet.add(field);
                    fields.push(field);
                }
            });
        });

        //html += "<table class='abm-table'><tr><th>ID</th>";
        html += "<table class='abm-list-table'><tr>";
        fields.forEach(field => {
            html += "<th>" + field + "</th>";
        });
        html += "<th>Acciones</th></tr>";

        rows.forEach(item => {
            if(item[idField] != 0) {
                html += "<tr>";
                //html += "<td>" + (item[idField] ?? "") + "</td>";
                fields.forEach(field => {
                    html += "<td>" + (item[field] ?? "") + "</td>";
                });
                html += "<td><img src='images/edit.png' class='abm-list-icon' title='Editar' onclick=\"window.location.replace('" + editPage + "?Id=" + item[idField] + "');\"></td>";
                html += "<td><img src='images/delete.png' class='abm-list-icon' title='Eliminar' onclick=\"window.location.replace('" + deletePage + "?Id=" + item[idField] + "');\"></td>";
                html += "</tr>";
            }
        });

        html += "</table>";
        document.getElementById(divId).innerHTML = html;
    }

    function OnLoad() {
        fetch("/cgi-bin/abmev.cgi") // Consulta
        .then(response => response.json())
        .then(data => ArmarLista(data, 'event_list_table_div', 'Eventos', 'Id', 'event_edit.html', 'event_delete.html'))
        .catch(error => {
            document.getElementById("event_list_table_div").innerHTML =
                '<p>Error al obtener el listado de Eventos: ' + error + '</p>';
        });
    }

</script>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
