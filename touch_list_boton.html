<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Tactiles - Botones</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
<script src="js/abm.js" type="text/javascript"></script>
</head>

<body onload='OnLoad();'>

<div id='touch_list_back_btn' class='back-btn' onclick="GoBack()" >
	<img id='touch_list_back_icon' class='icon-btn' src='images/back.png'>&nbsp;Volver
</div>

<div id='touch_list_add_btn' class='add-btn' onclick="AddBoton();" >
	<img id='touch_list_add__icon' class='icon-btn' src='images/add.png'>&nbsp;Nuevo
</div>

<div id='touch_list_table_div' class='abm-div'></div>

<script type="text/javascript" >
	const params = new URLSearchParams(window.location.search);
	const id = params.get('Id'); // recupera el valor de ?Id=123	
	const pantalla = params.get('Pantalla'); // recupera el valor de ?Pantalla=1
	var max_boton = 0;

	function ArmarLista(data, divId, title, idField, editPage) {
        if(data.error != 0) {
            document.getElementById(divId).innerHTML =
                '<p>Error al obtener el listado de Botones: ' + data.message + '</p>';
            return;
        }

        let html = '<div class=abm-table-title>&nbsp;' + title + '</div>\n';
        const rows = Array.isArray(data.response) ? data.response : [];
        if (rows.length === 0) {
            html += '<p>No hay datos disponibles.</p>';
            document.getElementById(divId).innerHTML = html;
            return;
        }

        const fieldSet = new Set();
        const fields = [];
        rows.forEach(item => {
            Object.keys(item).forEach(field => {
                if (field !== idField && !fieldSet.has(field)) {
                    fieldSet.add(field);
                    fields.push(field);
                }
            });
        });

        //html += "<table class='abm-table'><tr><th>ID</th>";
        html += "<table class='abm-list-table'><tr>";
        fields.forEach(field => {
            html += "<th>" + field + "</th>";
        });
        html += "<th>Modificar</th><th>Eliminar</th></tr>";

        rows.forEach(item => {
            html += "<tr>";
            //html += "<td>" + (item[idField] ?? "") + "</td>";
            fields.forEach(field => {
                if( field == "Nro") {
                    if(item[field] > max_boton) {
                        max_boton = item[field];
                    }
                }
                html += "<td>" + (item[field] ?? "") + "</td>";
            });
            html += "<td><img src='images/edit.png' class='abm-list-icon' title='Editar' onclick=\"window.location.replace('" + editPage + "?Id=" + id + "&Pantalla=" + pantalla + "&Boton=" + item[idField] + "');\"></td>";
            html += "<td><img src='images/delete.png' class='abm-list-icon' title='Eliminar' onclick=\"DelBoton(" + item[idField] + ");\"></td>";
            html += "</tr>";
        });

        html += "</table>";
        document.getElementById(divId).innerHTML = html;
    }

    function OnLoad() {
		max_boton = 0;
        fetch("/cgi-bin/abmtouch.cgi?funcion=list&Id=" + id + "&Pantalla=" + pantalla) // Consulta
        .then(response => response.json())
        .then(data => ArmarLista(data, 'touch_list_table_div', 'Tactiles - Botones', 'Boton', 'touch_edit_boton.html'))
        .catch(error => {
            document.getElementById("touch_list_table_div").innerHTML =
                '<p>Error al obtener el listado de Botones: ' + error + '</p>';
        });
    }

    function AddBoton() {
        document.getElementById('touch_list_table_div').innerHTML = '';
        max_boton++;
        fetch("/cgi-bin/abmtouch.cgi?funcion=add&Id=" + id + "&Pantalla=" + pantalla + "&Boton=" + max_boton) // Consulta
        .finally( OnLoad() );
    }

    function DelBoton(boton) {
        if(boton == max_boton) {
            document.getElementById('touch_list_table_div').innerHTML = '';
            fetch("/cgi-bin/abmtouch.cgi?funcion=delete&Id=" + id + "&Pantalla=" + pantalla + "&Boton=" + boton) // Consulta
            .finally( OnLoad() );
        }
	}

	function GoBack() {
		window.location.replace('touch_list_screen.html?Id=' + id);
    }
</script>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
