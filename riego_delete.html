<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Borrar Circuito de Riego</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
</head>

<body onload="OnLoad();">

<div id='riego_delete_back_btn' class='back-btn' onclick="window.location.replace('riego_list.html');" >
	<img id='riego_delete_back_icon' class='icon-btn' src='images/no.png'>&nbsp;Cancelar
</div>

<div id='riego_delete_save_btn' class='submit-btn' onclick="SaveData();" >
	<img id='riego_delete_save_icon' class='icon-btn' src='images/ok.png'>&nbsp;Borrar
</div>

<div id='riego_delete_div' class='abm-div'></div>

<script type="text/javascript" >
    function ArmarTabla(data, dst_div, title) {
        var dst = document.getElementById(dst_div);
        if (!dst) return;

        if (!data || typeof data !== 'object') {
            dst.innerHTML = '<p>Error: datos inválidos.</p>';
            return;
        }

        if (data.error !== 0) {
            dst.innerHTML = '<p>' + (data.message ? data.message : 'Error desconocido') + '</p>';
            return;
        }

        var response = data.response;
        if (!response || typeof response !== 'object') {
            dst.innerHTML = '<p>Error: respuesta inválida.</p>';
            return;
        }

        var obj = Array.isArray(response) ? (response.length ? response[0] : {}) : response;

        var headers = [];
        for (var k in obj) {
            if (headers.indexOf(k) === -1) headers.push(k);
        }

        var output = '<p class=abm-table-title>' + title + '</p>\n';
        output += '<table class=abm-table id=abm_edit_table>\n';

        for (var i = 0; i < headers.length; i++) {
            var h = headers[i];
            output += '<tr><td class=abm-table-header>' + h + '</td><td>' + obj[h] + '</td></tr>\n';
        }
        output += '</table>\n';
        dst.innerHTML = output;
    }

    function OnLoad() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('Id'); // recupera el valor de ?Id=123
        fetch("/cgi-bin/abmauto.cgi?funcion=get&Id=" + id) // Consulta
        .then(response => response.json())
        .then(data => ArmarTabla(data, 'riego_delete_div', 'Borrar Circuito de Riego'))
        .catch(error => {
            document.getElementById("riego_delete_div").innerHTML =
                "<p>Error al obtener datos: " + error + "</p>";
        });
    }

    function SaveData() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('Id'); // recupera el valor de ?Id=123
        fetch("/cgi-bin/abmauto.cgi?funcion=delete&Id=" + id) // Consulta
        .catch(function(){} )
        .finally(function(){ window.location.replace('riego_list.html'); });
    }
</script>

</form>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
