<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Actualizar </title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
</head>

<body>

<form enctype="multipart/form-data" action="update_form.html" method="post" id="update_form" name="update_form" method="post">

<div id='update_back_btn' class='back-btn' onclick="window.location.replace('config_menu.html');" >
	<img id='update_back_icon' class='icon-btn' src='images/no.png'>&nbsp;Volver
</div>

<div id='update_div' class='abm-div'>
    <p class=abm-table-title>&nbsp;Actualizar</p>
    <div id='update_result_div' class='abm-result-message'>&nbsp;</div>
    <table class='abm-table' >
    <tr>
        <td>&nbsp;</td>
        <td >Actualizar servicios</td>
        <td>&nbsp;</td>
        <td ><div id='update_service_result'><img src='images/update3.png' class='touch-icon-btn' title='Actualizar' onclick='UpdateService()'></div></td>
    </tr>
    <tr>
        <td>&nbsp;</td>
        <td >Actualizar firmware</td>
        <td>&nbsp;</td>
        <td ><div id='update_firmware_result'><img src='images/update3.png' class='touch-icon-btn' title='Actualizar' onclick='UpdateFirmware()'></div></td>
    </tr>
    <tr>
        <td>&nbsp;</td>
        <td >Actualizar web</td>
        <td>&nbsp;</td>
        <td ><div id='update_web_result'><img src='images/update3.png' class='touch-icon-btn' title='Actualizar' onclick='UpdateWeb()'></div></td>
    </tr>
    </table>
</div>

<script type="text/javascript" >

    function UpdateService() {
        fetch("/abm/update?funcion=servicio") // Consulta
        .then(response => response.json())
        .then(data => { ResponseUpdateService(data, null) })
        .catch(error => { ResponseUpdateService(null, error) });
    }

    function ResponseUpdateService(data, error) {
        if (data) {
            if (data.error != 0) {
                document.getElementById("update_service_result").innerHTML = "<img src='images/no.png' class='touch-icon-btn'>";
            } else {
                document.getElementById("update_service_result").innerHTML = "<img src='images/ok.png' class='touch-icon-btn'>";
            }
        } else {
            document.getElementById("update_service_result").innerHTML = "<img src='images/no.png' class='touch-icon-btn'>";
        }
    }

    function UpdateFirmware() {
        fetch("/abm/update?funcion=firmware") // Consulta
        .then(response => response.json())
        .then(data => { ResponseUpdateFirmware(data, null) })
        .catch(error => { ResponseUpdateFirmware(null, error) });
    }

    function ResponseUpdateFirmware(data, error) {
        if (data) {
            if (data.error != 0) {
                document.getElementById("update_firmware_result").innerHTML = "<img src='images/no.png' class='touch-icon-btn'>";
            } else {
                document.getElementById("update_firmware_result").innerHTML = "<img src='images/ok.png' class='touch-icon-btn'>";
            }
        } else {
            document.getElementById("update_firmware_result").innerHTML = "<img src='images/no.png' class='touch-icon-btn'>";
        }
    }

    function UpdateWeb() {
        fetch("/abm/update?funcion=web") // Consulta
        .then(response => response.json())
        .then(data => { ResponseUpdateWeb(data, null) })
        .catch(error => { ResponseUpdateWeb(null, error) });
    }

    function ResponseUpdateWeb(data, error) {
        if (data) {
            if (data.error != 0) {
                document.getElementById("update_web_result").innerHTML = "<img src='images/no.png' class='touch-icon-btn'>";
            } else {
                document.getElementById("update_web_result").innerHTML = "<img src='images/ok.png' class='touch-icon-btn'>";
            }
        } else {
            document.getElementById("update_web_result").innerHTML = "<img src='images/no.png' class='touch-icon-btn'>";
        }
    }




</script>

</form>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
