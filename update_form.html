<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Actualizar </title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
</head>

<body onload="OnLoad();">

<form enctype="multipart/form-data" action="update_form.html" method="post" id="update_form" name="update_form" method="post">

<div id='update_back_btn' class='back-btn' onclick="window.location.replace('config_menu.html');" >
	<img id='update_back_icon' class='icon-btn' src='images/no.png'>&nbsp;Volver
</div>

<div id='update_si_no'>
    <div id='update_save_btn' class='submit-btn' onclick="Upload();" >
        <img id='update_save_icon' class='icon-btn' src='images/ok.png'>&nbsp;Actualizar
    </div>
</div>

<div id='update_div' class='abm-div'>
    <p class=abm-table-title>&nbsp;Actualizar</p>
    <div id='update_result_div' class='abm-result-message'>&nbsp;</div>
</div>

<script type="text/javascript" >

    function OnLoad() {

    }

    function Upload() {
        var form = document.getElementById("update_form");
        var formData = new FormData(form);

        var xhr = new XMLHttpRequest();
        xhr.open("POST", "update_form.html", true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    document.getElementById("update_result_div").innerHTML = xhr.responseText;
                } else {
                    document.getElementById("update_result_div").innerHTML = "Error al actualizar: " + xhr.statusText;
                }
            }
        };
        xhr.send(formData);
    }
</script>

</form>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
