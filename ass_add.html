<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Objeto Nuevo</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
<script src="js/abm.js" type="text/javascript"></script>
</head>

<body  onload="OnLoad();">

<form id="add_form" name="add_form" method="post">

<div id='ass_add_back_btn' class='back-btn' onclick="window.location.replace('ass_list.html');" >
	<img id='ass_add_back_icon' class='icon-btn' src='images/no.png'>&nbsp;Cancelar
</div>

<div id='ass_add_save_btn' class='submit-btn' onclick="SaveData();" >
	<img id='ass_add_save_icon' class='icon-btn' src='images/ok.png'>&nbsp;Guardar
</div>

<div id='ass_add_div' class='abm-div'></div>

<script type="text/javascript" >
    var hw_list = [];

    function LoadHWList(data) {
        if(data.error != 0) return;
        list = data.response;
        for (var i = 0; i < list.length; i++) {
            var hw = {};
            hw.value = list[i].Id;
            hw.label = list[i].Dispositivo;
            hw_list.push(hw);
        }
    }

    function ArmarTabla(data, dst_div, title) {
        var dst = document.getElementById(dst_div);
        if (!dst) return;

        if (!data || typeof data !== 'object') {
            dst.innerHTML = '<p>Error: datos inválidos.</p>';
            return;
        }

        if (data.error !== 0) {
            dst.innerHTML = '<p>' + (data.message ? data.message : 'Error desconocido') + '</p>';
            return;
        }

        var response = data.response;
        if (!response || typeof response !== 'object') {
            dst.innerHTML = '<p>Error: respuesta inválida.</p>';
            return;
        }

        var obj = Array.isArray(response) ? (response.length ? response[0] : {}) : response;

        var headers = [];
        for (var k in obj) {
            if (headers.indexOf(k) === -1) headers.push(k);
        }

        var output = '<p class=abm-table-title>' + title + '</p>\n';
        output += '<table class=abm-table id=abm_edit_table>\n';

        for (var i = 0; i < headers.length; i++) {
            var h = headers[i];
            var val = obj[h];
            if (val === null || val === undefined || val === 'NULL') val = '';

            output += '<tr>';
            output += '<th>' + (h === 'Id' ? '&nbsp;' : h) + '</th>';
            output += '<td>';
            if (h === 'Id') {
                output += '<input type="hidden" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + String(val).replace(/"/g, '&quot;') + '" />';
            } else if (h === 'Dispositivo') {
                output += DropDownSelectValueLabel(h, hw_list, val, null);
            } else if (h === 'Port') {
                output += DropDownSelectValueLabel(h, PortAss, val, null);
            } else if (h === 'Tipo') {
                output += DropDownSelect(h, TipoAss, val, null);
            } else {
                output += '<input type="text" id="' + h + '" name="' + h + '" class="abm-edit-input-text" value="' + String(val).replace(/"/g, '&quot;') + '" />';
            }
            output += '</td>';
            output += '</tr>\n';
        }

        output += '</table>\n';
        dst.innerHTML = output;
    }

    function OnLoad() {
        fetch("/cgi-bin/abmhw.cgi?funcion=listall") // Consulta para armar listado de HW disponibles
        .then(response => response.json())
        .then(data => LoadHWList(data))
        .catch(error => {
            console.error("Error al cargar lista de HW: " + error);
        });

        fetch("/cgi-bin/abmassign.cgi?funcion=get&Id=0") // Consulta
        .then(response => response.json())
        .then(data => ArmarTabla(data, 'ass_add_div', 'Objeto Nuevo'))
        .catch(error => {
            document.getElementById("ass_add_div").innerHTML =
                "<p>Error al obtener datos: " + error + "</p>";
        });
    }
    
    function SaveData() {
        var kvpairs = [];
        var form = document.getElementById('add_form');
        if (!form) return;

        for ( var i = 0; i < form.elements.length; i++ ) {
            var e = form.elements[i];
            if (!e.name) continue;
            kvpairs.push(encodeURIComponent(e.name) + '=' + encodeURIComponent(e.value));
        }

        fetch("/cgi-bin/abmassign.cgi?funcion=add", {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: kvpairs.join('&')
        })
        .catch(function(){} )
        .finally(function(){ window.location.replace('ass_list.html'); });
    }
</script>

</form>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
