<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<script src="js/ajax.js" type="text/javascript"></script>
</head>

<body onload="OnLoad();">

<div class="back-btn" id="back-from-planta" onclick="window.location.replace('/');">
	<img id="back-icon" class="icon-btn" src="images/back.png">&nbsp;Volver
</div>

<div class="normal-btn" id="btn-planta-select1" onclick="window.location.replace('seguridad_menu.php');">
	<img id="seg-icon" class="icon-btn" src="images/lock1.png">&nbsp;Seguridad
</div>

<div class="normal-btn" id="btn-planta-select2" onclick="window.location.replace('config_menu.html');">
	<img id="config-icon" class="icon-btn" src="images/system.png">&nbsp;Configuración
</div>

<div class="normal-btn" id="btn-planta-select3" onclick="window.location.replace('panel_auto.html');">
	<img id="config-icon" class="icon-btn" src="images/gear.png">&nbsp;Automatizaci&oacute;n
</div>

<div class="home-group" id="home-div">
<!--	
include("obj_draw.php");
-->
	<img class="home-image" id="plano1" src="images/home.png" />
</div>

<script type="text/javascript" >

PLANTA=1;

// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('/');", 900000);

function insertarEstilos(obj_list) {
    // Crear el elemento <style>
    const style = document.createElement("style");
    let css = "";

    obj_list.forEach(item => {
        // Limpieza del nombre del objeto
        let Objeto = item.Objeto.replace(/ /g, "").replace(/\./g, "");

        // Coordenadas
        let Cord_x = item.Cord_x;
        let Cord_y = item.Cord_y;

        // Construcción del bloque CSS
        css += "#id-" + Objeto + " {z-index: 20;border: 0px;cursor: pointer;position: absolute;left: " + Cord_x + "px; top: " + Cord_y + "px;}\n";
    });

    // Insertar el CSS en el <style>
    style.innerHTML = css;
    // Agregar al <head>
    document.head.appendChild(style);
}

function renderObjetos(obj_list, edit = 0) {

    // Contenedor donde se insertarán los elementos
    const container = document.getElementById("planta") || document.body;

    obj_list.forEach(item => {

        // -----------------------------
        // Limpieza del nombre del objeto
        // -----------------------------
        let Objeto = item.Objeto.replace(/ /g, "").replace(/\./g, "");

        // -----------------------------
        // Icono según estado
        // -----------------------------
        let src = "";
        if (edit === 1 || item.Estado === 1) {
            src = "images/" + item.Icono_Encendido;
        } else {
            src = "images/" + item.Icono_Apagado;
        }

        // -----------------------------
        // Acción de click
        // -----------------------------
        let onclick = null;

        if (edit === 1) {
            onclick = () => window.location.replace('edit_assign.php?Id=' + item.Id);
        }
        else if (item.Tipo === 0) {
            onclick = () => fetch('/cgi-bin/abmassign.cgi?funcion=switch&Objeto=' + Objeto);
        }
        else if (item.Tipo === 5) {
            onclick = () => fetch('/cgi-bin/abmassign.cgi?funcion=pulse&Objeto=' + Objeto + '&Segundos=' + item.Analog_Mult_Div_Valor);
        }

        // -----------------------------
        // Crear el elemento según el tipo
        // -----------------------------
        let el;

        if (item.Tipo === 2) {
            // Display numérico
            el = document.createElement("div");
            el.className = "home-display";
            el.innerHTML = "&nbsp;9999&nbsp;";
        }
        else if (item.Tipo === 6) {
            // Display de temperatura / humedad / genérico
            el = document.createElement("div");
            el.className = "home-display";

            if (item.Port.startsWith("T")) {
                el.innerHTML = "&nbsp;T 00.0 °C&nbsp;";
            }
            else if (item.Port.startsWith("H")) {
                el.innerHTML = "&nbsp;Hr 00.0 %&nbsp;";
            }
            else {
                el.innerHTML = "&nbsp;" + item.Port + "&nbsp;";
            }
        }
        else {
            // Imagen genérica
            el = document.createElement("img");
            el.className = "home-image";
            el.src = src;
        }

        // ID del elemento
        el.id = "id-" + Objeto;

        // Asignar onclick si corresponde
        if (onclick) el.addEventListener("click", onclick);

        // Insertar en el contenedor
        container.appendChild(el);
    });
}

function updateHomePicture(msg) {
	try {
		jsonData = msg.response;
		if(jsonData) {
			var bg_data = jsonData.Planta1.split(';');
			document.getElementById('plano1').src = 'images/' + bg_data[0];
			if(bg_data[1] != null && bg_data[2] != null)
			{
				setTimeout("ScrollMap(" + bg_data[1] + "," + bg_data[2] + ");", 1000);
			}
		}
		else {
			fetch("/cgi-bin/abmsys.cgi?funcion=get_current") // Consulta
				.then(response => response.json())
				.then(data => updateHomePicture(data))
				.catch(error => { console.error('Error al obtener los estilos:', error); });
		}
	} catch (e) { return; }
}

function ScrollMap(x, y) {
	map = document.getElementById('home-div');
	map.scrollLeft = x;
	map.scrollTop = y;
}

function updateHomeStatus(msg) {
	try {
		jsonData = msg.response;

		if(!jsonData) return;

		for (var i = 0; i < jsonData.length; i++) { 
			//jsonData[i].Objeto
			//jsonData[i].Port
			//jsonData[i].Icono_Apagado
			//jsonData[i].Icono_Encendido
			//jsonData[i].Estado
			//jsonData[i].Tipo
			//jsonData[i].Perif_Data
			var Objeto = jsonData[i].Objeto;
			// Sustituciones (Mantener: obj_style.php objdraw.php planta.php)
			var objId = Objeto.replace(/ /g, '').replace(/\./g, '');
			if ( jsonData[i].Tipo == 2 ) {
				document.getElementById('id-'+objId).innerHTML = '&nbsp' + jsonData[i].Estado + '&nbsp';
			} else if ( jsonData[i].Tipo == 6 ) {
				if(jsonData[i].Port[0] == 'T') {
					document.getElementById('id-'+objId).innerHTML = '&nbsp;T ' + jsonData[i].Perif_Data + ' °C&nbsp;';
				} else if(jsonData[i].Port[0] == 'H') {
					document.getElementById('id-'+objId).innerHTML = '&nbsp;Hr ' + jsonData[i].Perif_Data + ' %&nbsp;';
				} else {
					document.getElementById('id-'+objId).innerHTML = '&nbsp;' + jsonData[i].Perif_Data + '&nbsp;';
				}
			} else {
				if(jsonData[i].Estado == 0) {
					document.getElementById('id-'+objId).src = 'images/' + jsonData[i].Icono_Apagado;
				} else if(jsonData[i].Estado == 1) {
					document.getElementById('id-'+objId).src = 'images/' + jsonData[i].Icono_Encendido;
				} else if(jsonData[i].Estado == 2) {
					document.getElementById('id-'+objId).src = 'images/' + jsonData[i].Icono_Auto;
				} else {
					document.getElementById('id-'+objId).src = 'images/no.png';
				}
			}
		}
	} catch (e) { return; }
}

function OnLoad( ) {
	fetch("/cgi-bin/abmassign.cgi?funcion=info&Planta=" + PLANTA) // Consulta
		.then(response => response.json())
		.then(data => insertarEstilos(data.response))
		.catch(error => { console.error('Error al obtener los estilos:', error); });

	fetch("/cgi-bin/abmassign.cgi?funcion=status&Planta=" + PLANTA) // Consulta
		.then(response => response.json())
		.then(data => renderObjetos(data.response))
		.catch(error => { console.error('Error al obtener los estilos:', error); });

	fetch("/cgi-bin/abmsys.cgi?funcion=get_current") // Consulta
		.then(response => response.json())
		.then(data => updateHomePicture(data))
		.catch(error => {
			document.getElementById("clima-exterior").innerHTML =
				"<p>Error al obtener datos externos: " + error + "</p>";
		});

	newAJAXCommand('/cgi-bin/abmassign.cgi?funcion=status&Planta=' + PLANTA , updateHomeStatus, true);
}


</script>
