<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<title>SYSHOME V 4.0 - Tactiles - Pantallas</title>
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2026">
<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
<link href="css/abm.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
<script src="js/abm.js" type="text/javascript"></script>
</head>

<body onload='OnLoad();'>

<div id='touch_list_back_btn' class='back-btn' onclick="window.location.replace('touch_list.html');" >
	<img id='touch_list_back_icon' class='icon-btn' src='images/back.png'>&nbsp;Volver
</div>

<div id='touch_list_add_btn' class='add-btn' onclick="AddScreen();" >
	<img id='touch_list_add__icon' class='icon-btn' src='images/add.png'>&nbsp;Nueva
</div>

<div id='touch_list_table_div' class='abm-div'></div>

<script type="text/javascript" >
	var max_pantalla = 0;
	const params = new URLSearchParams(window.location.search);
	const id = params.get('Id'); // recupera el valor de ?Id=123	

	function ArmarLista(data, divId, title, idField, editPage) {
        if(data.error != 0) {
            document.getElementById(divId).innerHTML =
                '<p>Error al obtener el listado de Pantallas: ' + data.message + '</p>';
            return;
        }

        let html = '<div class=abm-table-title>&nbsp;' + title + '</div>\n';
        const rows = Array.isArray(data.response) ? data.response : [];
        if (rows.length === 0) {
            html += '<p>No hay datos disponibles.</p>';
            document.getElementById(divId).innerHTML = html;
            return;
        }

        const fieldSet = new Set();
        const fields = [];
        rows.forEach(item => {
            Object.keys(item).forEach(field => {
                if (field !== idField && !fieldSet.has(field)) {
                    fieldSet.add(field);
                    fields.push(field);
                }
            });
        });

        //html += "<table class='abm-table'><tr><th>ID</th>";
        html += "<table class='abm-list-table'><tr>";
        fields.forEach(field => {
            html += "<th>" + field + "</th>";
        });
        html += "<th>Modificar</th><th>Eliminar</th></tr>";

        rows.forEach(item => {
            html += "<tr>";
            //html += "<td>" + (item[idField] ?? "") + "</td>";
            fields.forEach(field => {
                if( field == "Nro") {
                    if(item[field] > max_pantalla) {
                        max_pantalla = item[field];
                    }
                }
                html += "<td>" + (item[field] ?? "") + "</td>";
            });
            html += "<td><img src='images/edit.png' class='abm-list-icon' title='Editar' onclick=\"EditScreen(" + item[idField] + ");\"></td>";
            html += "<td><img src='images/delete.png' class='abm-list-icon' title='Eliminar' onclick=\"DelScreen(" + id + ", " + item[idField] + ");\"></td>";
            html += "</tr>";
        });

        html += "</table>";
        document.getElementById(divId).innerHTML = html;
    }

    function OnLoad() {
		max_pantalla = 0;
        fetch("/cgi-bin/abmtouch.cgi?funcion=list&Id=" + id) // Consulta
        .then(response => response.json())
        .then(data => ArmarLista(data, 'touch_list_table_div', 'Tactiles - Pantallas', 'Pantalla', 'touch_list_boton.html'))
        .catch(error => {
            document.getElementById("touch_list_table_div").innerHTML =
                '<p>Error al obtener el listado de Pantallas: ' + error + '</p>';
        });
    }

    function AddScreen() {
        document.getElementById('touch_list_table_div').innerHTML = '';
        max_pantalla++;
        fetch("/cgi-bin/abmtouch.cgi?funcion=add&Id=" + id + "&Pantalla=" + max_pantalla + "&Boton=1") // Consulta
        .finally( OnLoad() );
    }

    function DelScreen(Id, Pantalla) {
        if(Pantalla == max_pantalla) {
            document.getElementById('touch_list_table_div').innerHTML = '';
            fetch("/cgi-bin/abmtouch.cgi?funcion=delete&Id=" + Id + "&Pantalla=" + Pantalla) // Consulta
            .finally( OnLoad() );
        }
	}

	function EditScreen(Pantalla) {
		window.location.replace('touch_list_boton.html?Id=' + id + '&Pantalla=' + Pantalla);
    }
</script>

</body>

<script type="text/javascript" >
// 15 minutos de time-out de la pantalla por seguridad
setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
