<!DOCTYPE html>
<meta charset="utf-8">
<html>

<head>
	<title>SYSHOME V 4.0 - Tablero de Camaras</title>
	<meta name="author" content="Walter Pirri">
	<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM">
	<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
	<meta name="system-build" content="2026">
	<link href="css/dompiweb.css" rel="stylesheet" type="text/css" />
	<link href="css/abm.css" rel="stylesheet" type="text/css" />
	<script src="js/microdom.js" type="text/javascript"></script>
</head>

<body onload='OnLoad();'>

	<div id='tablero_list_back_btn' class='back-btn' onclick="window.location.replace('seguridad_menu.html');">
		<img id='tablero_list_back_icon' class='icon-btn' src='images/back.png'>&nbsp;Volver
	</div>

	<div id='camera_list' class='abm-lateral-list-div'></div>

	<div id='camera_image' class='abm-big-div'></div>
	<iframe id='nvr_image' class='abm-big-div'></iframe>

	<script type="text/javascript">
		function fillCameraShortList(json_list, dst_div) {
			// Getting the all column names 
			var output = '<table class=abm-list-table>\n';
			var i = 0;
			var j = 0;

			for (i = 0; i < json_list.length; i++) {
				if (json_list[i]['Id'] > 0) {
					output += '<tr><td onclick="SelectCamera(';
					output += '\'';
					output += json_list[i]['Nombre'];
					output += '\'';
					output += ',';
					output += '\'';
					output += json_list[i]['Direccion_IP'];
					output += '\'';
					output += ',';
					output += '\'';
					output += json_list[i]['Usuario'];
					output += '\'';
					output += ',';
					output += '\'';
					output += json_list[i]['Clave'];
					output += '\'';
					output += ',';
					output += '\'';
					output += json_list[i]['Protocolo'];
					output += '\'';
					output += ',';
					output += '\'';
					output += json_list[i]['Requerimiento'];
					output += '\'';
					output += ')">';
					output += json_list[i]['Nombre'];
					output += '</td></tr>';
				}
			}
			output += '</table>\n';
			document.getElementById(dst_div).innerHTML = output;

			if (json_list.length > 1) {
				SelectCamera(json_list[1]['Nombre'], json_list[1]['Direccion_IP'], json_list[1]['Usuario'], json_list[1]['Clave'], json_list[1]['Protocolo'], json_list[1]['Requerimiento']);
			}

			setTimeout(getCameraImage, 1000);
		}

		function SelectCamera(nombre, ip, usuario, clave, proto, req) {
			cam_nombre = nombre;
			cam_ip = ip;
			cam_auth = usuario + ':' + clave;
			cam_proto = proto;
			cam_req = req;

			if (cam_proto == 'iframe') {
				document.getElementById('nvr_image').src = cam_ip;
			}
		}

		function getCameraImage() {
			try {
				if (cam_nombre.length > 0) {
					if (cam_proto == 'http' || cam_proto == 'https') {
						//http://192.168.10.13/tmpfs/auto.jpg&auth=syshome:syshome      
						//newAJAXCommand('get_camera_http.php?src=' + cam_proto + '://' + cam_ip + cam_req + '&auth=' + cam_auth, refreshImage, false);
						//setTimeout(getCameraImage, 1000);
					}
					else if (cam_proto == 'rtsp') {
						// rtsp://admin:AUXGCQ@192.168.10.134:554/h264_stream
						//newAJAXCommand('get_camera_rtsp.php?src=' + cam_proto + '://' + cam_auth + '@' + cam_ip + cam_req, refreshImage, false);
						//setTimeout(getCameraImage, 1000);
					}
				}
			} catch (e) { }
		}

		function refreshImage(img_base64) {
			document.getElementById('camera_image').innerHTML = '<img width=540 src="data:image/png;base64, ' + img_base64 + '" />';
		}

		function loadCameraList(data) {
			fillCameraShortList(data.response, 'camera_list', 'Camaras', 'Id');
		}

		function OnLoad() {
			fetch("/abm/abmcamara?funcion=listall") // Consulta
				.then(response => response.json())
				.then(data => loadCameraList(data))
				.catch(error => {
					document.getElementById("camera_list").innerHTML =
						'<p>Error al obtener el listado de Cámaras: ' + error + '</p>';
				});
		}
	</script>

</body>

<script type="text/javascript">
	// 15 minutos de time-out de la pantalla por seguridad
	setTimeout("window.location.replace('index.html');", 900000);
</script>

</html>
